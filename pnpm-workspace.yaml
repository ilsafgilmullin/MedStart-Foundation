minimumReleaseAge: 1440

overrides:
  brace-expansion@<=5.0.8: 5.0.9
  postcss@<=8.5.17: 8.5.23
  sharp@<0.35.0: 0.35.3
  uuid@<11.1.1: 11.1.1

packages:
  - artifacts/medstart

catalog:
  '@types/node': ^25.3.3
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  clsx: ^2.1.1
  lucide-react: ^0.545.0
  react: 19.1.0
  react-dom: 19.1.0
  tailwind-merge: ^3.3.1
  tailwindcss: ^4.1.14

autoInstallPeers: false

# Build scripts required by Next.js, Firebase, and the CSS toolchain.
allowBuilds:
  '@firebase/util': true
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - unrs-resolver
