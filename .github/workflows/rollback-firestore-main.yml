name: One-time Firestore Rules rollback to current main

on:
  push:
    branches:
      - ops/rollback-firestore-main-20260807
    paths:
      - '.github/workflows/rollback-firestore-main.yml'

permissions:
  contents: write

concurrency:
  group: firestore-rules-rollback-main-20260807-v2
  cancel-in-progress: false

jobs:
  rollback:
    if: ${{ github.event.head_commit.message != 'ops: confirm Firestore rules rollback to current main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_MAIN_SHA: adb30c5a91e251983eaacdb6f87de2e79a9190ec
      FIREBASE_PROJECT_ID: medstart-e9bfe
    steps:
      - name: Checkout exact rollback branch
        uses: actions/checkout@v4
        with:
          ref: ops/rollback-firestore-main-20260807
          fetch-depth: 0

      - name: Verify exact current-main source
        id: source
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" HEAD
          git show "$EXPECTED_MAIN_SHA:firestore.secure.rules" > "$RUNNER_TEMP/main-firestore.secure.rules"
          git show "$EXPECTED_MAIN_SHA:firebase.json" > "$RUNNER_TEMP/main-firebase.json"
          cmp -s firestore.secure.rules "$RUNNER_TEMP/main-firestore.secure.rules"
          cmp -s firebase.json "$RUNNER_TEMP/main-firebase.json"
          grep -q '"rules": "firestore.secure.rules"' firebase.json
          test ! -e firestore.rules

      - name: Set up pnpm
        if: steps.source.outcome == 'success'
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        if: steps.source.outcome == 'success'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Set up Java for Firestore rules compilation
        if: steps.source.outcome == 'success'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install locked dependencies
        id: install
        if: steps.source.outcome == 'success'
        continue-on-error: true
        run: pnpm install --frozen-lockfile --reporter=silent

      - name: Compile current-main Firestore Rules
        id: compile
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: >-
          pnpm dlx firebase-tools@15.24.0 emulators:exec
          --only firestore
          --project demo-medstart
          "node -e \"console.log('Current-main Firestore Rules compiled successfully.')\""

      - name: Prepare Firebase service account
        id: credentials
        if: steps.compile.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo 'GitHub secret FIREBASE_SERVICE_ACCOUNT_JSON is not configured.'
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"

      - name: Publish and verify only current-main Firestore Rules
        id: deploy
        if: steps.credentials.outcome == 'success'
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          pnpm --dir artifacts/medstart exec node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto'
          import { readFileSync, writeFileSync } from 'node:fs'
          import { setTimeout as delay } from 'node:timers/promises'
          import { applicationDefault } from 'firebase-admin/app'

          const projectId = process.env.FIREBASE_PROJECT_ID
          const expectedMainSha = process.env.EXPECTED_MAIN_SHA
          const rulesPath = '../../firestore.secure.rules'
          const expectedContent = readFileSync(rulesPath, 'utf8')
          const expectedSha256 = createHash('sha256').update(expectedContent).digest('hex')
          const releaseName = `projects/${projectId}/releases/cloud.firestore`
          const report = {
            status: 'running',
            projectId,
            sourceBranch: 'main',
            sourceCommit: expectedMainSha,
            sourceFile: 'firestore.secure.rules',
            expectedSha256,
            deployedScope: 'firestore:rules',
            storageRulesChanged: false,
            indexesChanged: false,
            dataChanged: false,
            verifiedAt: new Date().toISOString(),
          }

          function safeError(error) {
            return error instanceof Error
              ? error.message.slice(0, 800)
              : String(error).slice(0, 800)
          }

          async function rulesRequest(path, token, method = 'GET', body) {
            const response = await fetch(`https://firebaserules.googleapis.com/v1/${path}`, {
              method,
              headers: {
                authorization: `Bearer ${token}`,
                ...(body ? { 'content-type': 'application/json' } : {}),
              },
              ...(body ? { body: JSON.stringify(body) } : {}),
            })
            const payload = await response.json().catch(() => ({}))
            return { response, payload }
          }

          let failure
          try {
            const access = await applicationDefault().getAccessToken()
            const token = access.access_token
            if (!token) throw new Error('Firebase credential did not return an access token.')

            const created = await rulesRequest(
              `projects/${projectId}/rulesets`,
              token,
              'POST',
              {
                source: {
                  files: [{ name: 'firestore.secure.rules', content: expectedContent }],
                },
              },
            )
            if (!created.response.ok || !created.payload?.name) {
              throw new Error(
                `Rules API could not create rollback ruleset: ${String(created.payload?.error?.message || created.response.status)}`,
              )
            }
            const rulesetName = created.payload.name

            const current = await rulesRequest(releaseName, token)
            if (current.response.status === 404) {
              const release = await rulesRequest(
                `projects/${projectId}/releases`,
                token,
                'POST',
                { name: releaseName, rulesetName },
              )
              if (!release.response.ok) {
                throw new Error(
                  `Rules API could not create Firestore release: ${String(release.payload?.error?.message || release.response.status)}`,
                )
              }
            } else {
              if (!current.response.ok) {
                throw new Error(
                  `Rules API could not read Firestore release: ${String(current.payload?.error?.message || current.response.status)}`,
                )
              }
              const release = await rulesRequest(
                releaseName,
                token,
                'PATCH',
                {
                  release: { name: releaseName, rulesetName },
                  updateMask: 'rulesetName',
                },
              )
              if (!release.response.ok) {
                throw new Error(
                  `Rules API could not update Firestore release: ${String(release.payload?.error?.message || release.response.status)}`,
                )
              }
            }

            let activeRelease
            for (let attempt = 0; attempt < 10; attempt += 1) {
              const result = await rulesRequest(releaseName, token)
              if (result.response.ok && result.payload?.rulesetName === rulesetName) {
                activeRelease = result.payload
                break
              }
              await delay(1_000)
            }
            if (!activeRelease) {
              throw new Error('Active Firestore release did not converge to the rollback ruleset.')
            }

            const activeRuleset = await rulesRequest(`${rulesetName}?view=FULL`, token)
            if (!activeRuleset.response.ok) {
              throw new Error(
                `Rules API could not read active rollback ruleset: ${String(activeRuleset.payload?.error?.message || activeRuleset.response.status)}`,
              )
            }
            const files = Array.isArray(activeRuleset.payload?.source?.files)
              ? activeRuleset.payload.source.files
              : []
            const matchedFile = files.find((file) => {
              const content = String(file?.content || '')
              return createHash('sha256').update(content).digest('hex') === expectedSha256
            })
            if (!matchedFile) {
              throw new Error('Active production Firestore ruleset does not match current main.')
            }

            Object.assign(report, {
              status: 'verified',
              activeRulesetName: rulesetName,
              activeRulesetFileName: String(matchedFile.name || ''),
              releaseUpdateTime: String(activeRelease.updateTime || ''),
              verifiedAt: new Date().toISOString(),
            })
            console.log(`FIRESTORE_ROLLBACK_VERIFIED=${expectedSha256}`)
          } catch (error) {
            failure = error
            Object.assign(report, {
              status: 'failed',
              error: safeError(error),
              verifiedAt: new Date().toISOString(),
            })
            console.error(`FIRESTORE_ROLLBACK_FAILED=${safeError(error)}`)
          } finally {
            writeFileSync('../../firestore-rollback-report.json', `${JSON.stringify(report, null, 2)}\n`)
          }

          if (failure) throw failure
          NODE

      - name: Remove one-time workflow and preserve sanitized report
        if: always()
        shell: bash
        env:
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          CREDENTIALS_OUTCOME: ${{ steps.credentials.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          set -euo pipefail
          if [ ! -f firestore-rollback-report.json ]; then
            node - <<'NODE'
            const fs = require('node:fs')
            const report = {
              status: 'failed',
              projectId: process.env.FIREBASE_PROJECT_ID,
              sourceBranch: 'main',
              sourceCommit: process.env.EXPECTED_MAIN_SHA,
              sourceFile: 'firestore.secure.rules',
              deployedScope: 'firestore:rules',
              storageRulesChanged: false,
              indexesChanged: false,
              dataChanged: false,
              stageOutcomes: {
                source: process.env.SOURCE_OUTCOME,
                install: process.env.INSTALL_OUTCOME,
                compile: process.env.COMPILE_OUTCOME,
                credentials: process.env.CREDENTIALS_OUTCOME,
                deploy: process.env.DEPLOY_OUTCOME,
              },
              error: 'Rollback stopped before the production verification report was created.',
              verifiedAt: new Date().toISOString(),
            }
            fs.writeFileSync('firestore-rollback-report.json', `${JSON.stringify(report, null, 2)}\n`)
            NODE
          fi
          mkdir -p .github/rollback-reports
          mv firestore-rollback-report.json .github/rollback-reports/firestore-main-20260807.json
          rm .github/workflows/rollback-firestore-main.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .github/rollback-reports/firestore-main-20260807.json .github/workflows/rollback-firestore-main.yml
          git commit -m 'ops: confirm Firestore rules rollback to current main'
          git push origin HEAD:ops/rollback-firestore-main-20260807

      - name: Enforce verified rollback
        if: always()
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        run: test "$DEPLOY_OUTCOME" = 'success'
