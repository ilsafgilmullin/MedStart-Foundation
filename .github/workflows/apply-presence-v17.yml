name: Apply MedStart presence surfaces v17

on:
  push:
    branches:
      - agent/platform-presence-v17
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-presence-v17
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/platform-presence-v17
          fetch-depth: 0

      - name: Apply deterministic presence patch
        run: node scripts/apply-presence-surfaces-v17.mjs

      - name: Commit product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "medstart-presence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add artifacts/medstart
          if git diff --cached --quiet; then
            echo "No product changes required"
            exit 0
          fi
          git commit -m "Подключить статусы присутствия по всей платформе"
          git push origin HEAD:agent/platform-presence-v17
