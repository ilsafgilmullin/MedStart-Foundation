name: One-time knowledge moderator guard patch

on:
  push:
    branches:
      - security/moderator-role
    paths:
      - '.github/workflows/patch-knowledge-moderator-guard.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/moderator-role
          fetch-depth: 0
      - name: Move knowledge moderation to the isolated moderation guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('artifacts/medstart/app/api/knowledge/moderation/route.ts')
          text = path.read_text()

          old_import = """import {\n  AdminAccessError,\n  adminErrorResponse,\n  requireAdminActor,\n} from '@/lib/server/admin-control'\n"""
          new_import = """import { AdminAccessError } from '@/lib/server/admin-control'\nimport {\n  moderationErrorResponse,\n  requireModerationActor,\n  type ModerationActor,\n} from '@/lib/server/moderation-control'\n"""
          if old_import not in text:
            raise SystemExit('Knowledge moderation admin import marker missing')
          text = text.replace(old_import, new_import, 1)

          old_actor_type = "  actor: Awaited<ReturnType<typeof requireAdminActor>>\n"
          new_actor_type = "  actor: ModerationActor\n"
          if old_actor_type not in text:
            raise SystemExit('Knowledge audit actor type marker missing')
          text = text.replace(old_actor_type, new_actor_type, 1)

          old_guard = "    const actor = await requireAdminActor(request)\n"
          new_guard = "    const actor = await requireModerationActor(request)\n"
          if old_guard not in text:
            raise SystemExit('Knowledge moderation guard marker missing')
          text = text.replace(old_guard, new_guard, 1)

          old_error = """    const response = adminErrorResponse(error)\n    return NextResponse.json(response.body, {\n      status: response.status,\n      headers: { 'Cache-Control': 'no-store' },\n    })\n"""
          new_error = """    const response =\n      error instanceof AdminAccessError\n        ? {\n            status: error.status,\n            body: { ok: false, code: error.code, error: error.message },\n          }\n        : moderationErrorResponse(error)\n    return NextResponse.json(response.body, {\n      status: response.status,\n      headers: { 'Cache-Control': 'no-store' },\n    })\n"""
          if old_error not in text:
            raise SystemExit('Knowledge moderation error handler marker missing')
          text = text.replace(old_error, new_error, 1)

          path.write_text(text)
          PY
          git diff --check
      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/patch-knowledge-moderator-guard.yml
          git add artifacts/medstart/app/api/knowledge/moderation/route.ts
          git diff --cached --check
          git commit -m 'fix(moderation): authorize knowledge moderators safely'
          git push origin HEAD:security/moderator-role
