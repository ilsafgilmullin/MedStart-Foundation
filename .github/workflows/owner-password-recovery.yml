name: Owner password recovery

on:
  pull_request:
    branches:
      - main
    paths:
      - artifacts/medstart/scripts/generate-owner-recovery.mjs
      - .github/workflows/owner-password-recovery.yml

permissions:
  contents: read

jobs:
  recovery:
    if: github.head_ref == 'audit/auth-complete-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=silent

      - name: Prepare Firebase service account
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"

      - name: Generate private recovery link
        working-directory: artifacts/medstart
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: node scripts/generate-owner-recovery.mjs

      - name: Upload private recovery file
        uses: actions/upload-artifact@v4
        with:
          name: medstart-owner-password-recovery
          path: artifacts/medstart/owner-password-recovery.txt
          if-no-files-found: error
          retention-days: 1
