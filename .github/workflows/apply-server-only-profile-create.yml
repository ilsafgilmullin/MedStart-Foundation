name: Apply server-only profile creation rule

on:
  push:
    branches:
      - 'agent/full-repository-audit-v8'
    paths:
      - '.github/workflows/apply-server-only-profile-create.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: agent/full-repository-audit-v8

      - name: Replace only the client profile-create permission
        run: |
          python - <<'PY'
          from pathlib import Path

          rules_path = Path('firestore.secure.rules')
          source = rules_path.read_text(encoding='utf-8')
          old = '      allow create: if isOwnProfile(userId) && validNewProfile(userId);'
          new = '      allow create: if false;'
          if source.count(old) != 1:
              raise SystemExit(f'Expected exactly one profile-create rule, found {source.count(old)}')
          rules_path.write_text(source.replace(old, new, 1), encoding='utf-8')

          workflow = Path('.github/workflows/apply-server-only-profile-create.yml')
          workflow.unlink()
          PY

      - name: Commit exact rules patch
        run: |
          git config user.name 'MedStart Security Audit'
          git config user.email 'actions@users.noreply.github.com'
          git add firestore.secure.rules .github/workflows/apply-server-only-profile-create.yml
          git commit -m 'Block direct client profile creation'
          git push origin HEAD:agent/full-repository-audit-v8
