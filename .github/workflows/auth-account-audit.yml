name: Firebase account audit

on:
  pull_request:
    branches:
      - main
    paths:
      - artifacts/medstart/scripts/audit-auth-users.mjs
      - .github/workflows/auth-account-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Firebase service account
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "GitHub secret FIREBASE_SERVICE_ACCOUNT_JSON is not configured."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"

      - name: Audit Firebase Authentication and profiles
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: pnpm --dir artifacts/medstart exec node scripts/audit-auth-users.mjs

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: medstart-auth-audit
          path: auth-audit-report.json
          if-no-files-found: error
          retention-days: 3
