name: Low audit diagnostics

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/apply-low-audit.py'
      - '.github/workflows/low-audit-diagnostics.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/low-audit-v1

      - name: Apply low-audit migration in diagnostics workspace
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-low-audit.py')
          text = path.read_text()
          old = '"                <input\\n                  className={inputClass}\\n                  placeholder=\\"Например: анатомия и физиология\\""'
          new = '"<input\\n                className={inputClass}\\n                placeholder=\\"Например: анатомия и физиология\\""'
          if old in text:
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          python scripts/apply-low-audit.py

      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Capture typecheck output
        shell: bash
        run: |
          set +e
          pnpm --filter @workspace/medstart typecheck > low-audit-typecheck.txt 2>&1
          status=$?
          cat low-audit-typecheck.txt
          echo "exit_status=$status" >> low-audit-typecheck.txt
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: low-audit-diagnostics
          path: |
            low-audit-typecheck.txt
            artifacts/medstart/components/live/MedicalWorkspace.tsx
          retention-days: 3