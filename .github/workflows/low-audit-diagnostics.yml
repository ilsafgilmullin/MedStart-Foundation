name: Low audit diagnostics

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/apply-low-audit.py'
      - '.github/workflows/low-audit-diagnostics.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/low-audit-v1
      - name: Repair known selector and capture migration output
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-low-audit.py')
          text = path.read_text()
          old = '"                <input\\n                  className={inputClass}\\n                  placeholder=\\"Например: анатомия и физиология\\""'
          new = '"              <input\\n                  className={inputClass}\\n                  placeholder=\\"Например: анатомия и физиология\\""'
          if old in text:
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          set +e
          python scripts/apply-low-audit.py > low-audit-diagnostics.txt 2>&1
          status=$?
          echo "exit_status=$status" >> low-audit-diagnostics.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: low-audit-diagnostics
          path: low-audit-diagnostics.txt
          retention-days: 3
