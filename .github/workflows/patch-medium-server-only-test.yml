name: Patch medium server-only profile test

on:
  push:
    branches:
      - 'agent/full-repository-audit-v8'
    paths:
      - '.github/workflows/patch-medium-server-only-test.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-repository-audit-v8

      - name: Replace the obsolete successful client-create assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/test-medium-rules.mjs')
          source = path.read_text(encoding='utf-8')
          old = '''  await assertSucceeds(
              setDoc(
                doc(newStudent.firestore(), 'users', newStudentUid),
                profile(newStudentUid, 'student'),
              ),
            )'''
          new = '''  await assertFails(
              setDoc(
                doc(newStudent.firestore(), 'users', newStudentUid),
                profile(newStudentUid, 'student'),
              ),
            )'''
          if source.count(old) != 1:
              raise SystemExit(f'Expected one client-create assertion, found {source.count(old)}')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/patch-medium-server-only-test.yml').unlink()
          PY

      - name: Commit test correction
        run: |
          git config user.name 'MedStart Security Audit'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/test-medium-rules.mjs .github/workflows/patch-medium-server-only-test.yml
          git commit -m 'Expect client profile creation to fail in medium rules suite'
          git push origin HEAD:agent/full-repository-audit-v8
