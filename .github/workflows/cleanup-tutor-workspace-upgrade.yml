name: Clean MedStart tutor workspace transport

on:
  push:
    branches:
      - agent/tutor-workspace-upgrade-v13
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upgrade branch
        uses: actions/checkout@v4
        with:
          ref: agent/tutor-workspace-upgrade-v13
          fetch-depth: 0
          show-progress: false
      - name: Remove temporary transport
        run: |
          rm -rf .tutor-upgrade
          rm -f .github/workflows/apply-tutor-workspace-upgrade.yml
          rm -f .github/workflows/tutor-workspace-snapshot.yml
          rm -f .github/workflows/cleanup-tutor-workspace-upgrade.yml
      - name: Commit clean branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Удалить временные файлы переработки кабинета репетитора"
          git push origin HEAD:agent/tutor-workspace-upgrade-v13
