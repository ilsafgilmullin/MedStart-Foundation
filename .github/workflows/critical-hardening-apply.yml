name: Apply critical hardening

on:
  push:
    branches:
      - fix/critical-hardening-v1
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: medstart-critical-hardening
  cancel-in-progress: false

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Apply deterministic migration
        run: node scripts/run-critical-hardening.mjs

      - name: Verify security invariants
        run: node scripts/verify-critical-hardening.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck MedStart
        run: pnpm --filter @workspace/medstart typecheck

      - name: Build MedStart
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: test-api-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: example.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: example
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: example.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '123456789'
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:123456789:web:test
          NEXT_PUBLIC_OWNER_UID: test-owner
        run: pnpm --filter @workspace/medstart build

      - name: Commit validated hardening
        run: |
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firestore.rules storage.rules artifacts/medstart scripts .github/workflows
          git commit -m "security: fix critical MedStart vulnerabilities"
          git push origin HEAD:fix/critical-hardening-v1
