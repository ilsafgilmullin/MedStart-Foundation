name: Apply MedStart Live v19

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/live-workspace-v19.part*'
      - '.github/live-workspace-v19.ready'
      - '.github/workflows/medstart-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/live-workspace-anatomy-v19
          fetch-depth: 0
          show-progress: false

      - name: Verify package
        shell: bash
        run: |
          set -euo pipefail
          cat .github/live-workspace-v19.part* > /tmp/package.b64
          test "$(wc -c < /tmp/package.b64)" = "26440"
          echo "8911a17369f4d21608d80bfc86b34d801879578672d421e534f19e00f39b6158  /tmp/package.b64" | sha256sum -c -
          base64 -d /tmp/package.b64 | gzip -dc > /tmp/full.patch
          echo "215a117689623192d4599d6e945b9184849ddec46cf9d4f9bf5b683210071ecf  /tmp/full.patch" | sha256sum -c -
          awk 'BEGIN { keep=0 } /^diff --git a\/artifacts\// { keep=1 } keep { print }' /tmp/full.patch > /tmp/product.patch

      - name: Apply product files
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          git checkout origin/main -- .github/workflows/medstart-ci.yml
          git apply --check /tmp/product.patch
          git apply /tmp/product.patch
          rm -f .github/live-workspace-v19.part* .github/live-workspace-v19.ready
          git add -A
          git diff --cached --check

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Профессионально переработать MedStart Live и анатомию"
          git push origin HEAD:agent/live-workspace-anatomy-v19
