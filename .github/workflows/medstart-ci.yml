name: MedStart CI

on:
  push:
    branches:
      - main
      - 'fix/**'
    paths:
      - 'artifacts/medstart/**'
      - 'scripts/**'
      - 'firestore.rules'
      - 'firestore.secure.rules'
      - 'storage.rules'
      - 'firebase.json'
      - 'firestore.indexes.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'tsconfig*.json'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
    paths:
      - 'artifacts/medstart/**'
      - 'scripts/**'
      - 'firestore.rules'
      - 'firestore.secure.rules'
      - 'storage.rules'
      - 'firebase.json'
      - 'firestore.indexes.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'tsconfig*.json'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: medstart-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify hardened Firebase configuration
        run: |
          test -f firestore.secure.rules
          test -f storage.rules
          grep -q '"rules": "firestore.secure.rules"' firebase.json
          grep -q 'allow create, update: if false;' storage.rules
          grep -A2 'match /bookings/{bookingId}' firestore.secure.rules | grep -q 'allow create: if false;'
          grep -A2 'match /conversations/{conversationId}' firestore.secure.rules | grep -q 'allow create: if false;'
          ! grep -q 'medstart-board-' artifacts/medstart/components/live/ServerlessWhiteboard.tsx
          test -f artifacts/medstart/app/api/bookings/route.ts
          grep -q "fetch('/api/bookings'" artifacts/medstart/lib/bookings.ts
          test -f scripts/test-critical-rules.mjs
          test -f scripts/test-medium-rules.mjs

      - name: Verify medium-stage invariants
        run: node scripts/verify-medium-stage-final.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile and test Firebase security rules
        env:
          CI: 'true'
        run: >-
          pnpm dlx firebase-tools@15.24.0 emulators:exec
          --only firestore,storage
          --project demo-medstart
          "node scripts/test-critical-rules.mjs && node scripts/test-medium-rules.mjs"

      - name: Typecheck MedStart
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @workspace/medstart typecheck 2>&1 | tee typecheck.log

      - name: Upload typecheck report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medstart-typecheck
          path: typecheck.log
          if-no-files-found: warn
          retention-days: 3

      - name: Build MedStart
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: test-api-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: example.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: example
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: example.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '123456789'
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:123456789:web:test
          NEXT_PUBLIC_OWNER_UID: test-owner
        run: pnpm --filter @workspace/medstart build
