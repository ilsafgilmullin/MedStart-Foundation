name: MedStart CI

on:
  push:
    branches:
      - audit/medstart-v2-clean
  pull_request:
    paths:
      - 'artifacts/medstart/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'tsconfig*.json'
      - '.github/workflows/medstart-ci.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Refresh lockfile on refactor branch
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit lockfile changes
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile is already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore: refresh pnpm lockfile"
            git push
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck MedStart
        id: typecheck
        continue-on-error: true
        run: pnpm --filter @workspace/medstart typecheck > typecheck.log 2>&1

      - name: Upload typecheck report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medstart-typecheck-report
          path: typecheck.log
          if-no-files-found: error
          retention-days: 3

      - name: Stop after typecheck errors
        if: steps.typecheck.outcome == 'failure'
        run: |
          cat typecheck.log
          exit 1

      - name: Build MedStart
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: test-api-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: example.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: example
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: example.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '123456789'
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:123456789:web:test
          NEXT_PUBLIC_OWNER_UID: test-owner
        run: pnpm --filter @workspace/medstart build
