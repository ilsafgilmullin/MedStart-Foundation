name: MedStart CI

on:
  push:
    branches:
      - main
      - 'fix/**'
    paths:
      - 'artifacts/medstart/**'
      - 'scripts/**'
      - 'firestore.rules'
      - 'firestore.secure.rules'
      - 'storage.rules'
      - 'firebase.json'
      - 'firestore.indexes.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'tsconfig*.json'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
    paths:
      - 'artifacts/medstart/**'
      - 'scripts/**'
      - 'firestore.rules'
      - 'firestore.secure.rules'
      - 'storage.rules'
      - 'firebase.json'
      - 'firestore.indexes.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'tsconfig*.json'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: medstart-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # TEMP MEDIUM APPLY START
      - name: Apply remaining medium-level hardening
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/medium-audit-v1'
        shell: bash
        run: |
          python <<'EXTRACT'
          from pathlib import Path

          source = Path('.github/workflows/apply-medium-stage2-once.yml').read_text()
          start_marker = "          python <<'PY'\n"
          end_marker = "\n          PY"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          embedded = source[start:end]
          lines = [line[10:] if line.startswith('          ') else line for line in embedded.splitlines()]
          script = '\n'.join(lines) + '\n'

          script = script.replace(
              "'    match /medicalWorkspaces/{bookingId}/assets/{assetId} {'",
              "'      match /assets/{assetId} {'",
              1,
          )
          script = script.replace(
              "      allow delete: if isOwner();\n    }''',\n    'medical workspace write rules',",
              "      allow delete: if isOwner();''',\n    'medical workspace write rules',",
              1,
          )

          tail_start = script.index("old_transaction = '''")
          tail_end_marker = 'workspace_path.write_text(workspace)'
          tail_end = script.index(tail_end_marker, tail_start) + len(tail_end_marker)
          corrected_tail = '''transaction_start = workspace.index("    transaction.set(\\n")
transaction_end = workspace.index("\\n    )", transaction_start) + len("\\n    )")
new_transaction = """    const normalizedCurrent = normalizeWorkspace(bookingId, current)

    transaction.set(workspaceRef, {
      ...normalizedCurrent,
      ...patch,
      bookingId,
      updatedByUid: userUid,
      createdAt: snapshot.exists()
        ? current?.createdAt ?? serverTimestamp()
        : serverTimestamp(),
      updatedAt: serverTimestamp(),
    })"""
workspace = workspace[:transaction_start] + new_transaction + workspace[transaction_end:]

loader_start = workspace.index(
    "export async function loadMedicalAssetObjectUrl(asset: MedicalAsset) {"
)
loader_end_marker = "\\n}\\n\\nexport async function deleteMedicalAsset"
loader_end = workspace.index(loader_end_marker, loader_start) + 2
new_loader = """export async function loadMedicalAssetObjectUrl(asset: MedicalAsset) {
  if (asset.mimeType === 'application/dicom') return ''
  return getDownloadURL(ref(storage, asset.storagePath))
}"""
workspace = workspace[:loader_start] + new_loader + workspace[loader_end:]
workspace_path.write_text(workspace)'''
          script = script[:tail_start] + corrected_tail + script[tail_end:]
          Path('/tmp/apply-medium-stage2.py').write_text(script)
          EXTRACT
          python /tmp/apply-medium-stage2.py
      # TEMP MEDIUM APPLY END

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify hardened Firebase configuration
        run: |
          test -f firestore.secure.rules
          test -f storage.rules
          grep -q '"rules": "firestore.secure.rules"' firebase.json
          grep -q 'allow create, update: if false;' storage.rules
          grep -A2 'match /bookings/{bookingId}' firestore.secure.rules | grep -q 'allow create: if false;'
          grep -A2 'match /conversations/{conversationId}' firestore.secure.rules | grep -q 'allow create: if false;'
          ! grep -q 'medstart-board-' artifacts/medstart/components/live/ServerlessWhiteboard.tsx
          test -f artifacts/medstart/app/api/bookings/route.ts
          grep -q "fetch('/api/bookings'" artifacts/medstart/lib/bookings.ts
          test -f scripts/test-critical-rules.mjs
          test -f scripts/test-medium-rules.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile and test Firebase security rules
        env:
          CI: 'true'
        run: >-
          pnpm dlx firebase-tools@15.24.0 emulators:exec
          --only firestore,storage
          --project demo-medstart
          "node scripts/test-critical-rules.mjs && node scripts/test-medium-rules.mjs"

      - name: Typecheck MedStart
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @workspace/medstart typecheck 2>&1 | tee typecheck.log

      - name: Upload typecheck report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medstart-typecheck
          path: typecheck.log
          if-no-files-found: warn
          retention-days: 3

      - name: Build MedStart
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: test-api-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: example.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: example
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: example.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '123456789'
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:123456789:web:test
          NEXT_PUBLIC_OWNER_UID: test-owner
        run: pnpm --filter @workspace/medstart build

      # TEMP MEDIUM COMMIT START
      - name: Commit validated medium-level hardening
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/medium-audit-v1'
        shell: bash
        run: |
          rm -f .github/workflows/apply-medium-stage2-once.yml
          rm -f .github/workflows/apply-medium-stage2-runner.yml
          rm -f .github/workflows/apply-medium-stage2-v3.yml
          rm -f .github/workflows/apply-medium-stage2-v4.yml
          rm -f .github/workflows/apply-verified-access.yml
          rm -f .github/workflows/medium-stage2-error.yml
          python <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/medstart-ci.yml')
          text = path.read_text()
          text = text.replace('permissions:\n  contents: write', 'permissions:\n  contents: read', 1)
          for start_marker, end_marker in [
              ('      # TEMP MEDIUM APPLY START\n', '      # TEMP MEDIUM APPLY END\n'),
              ('      # TEMP MEDIUM COMMIT START\n', '      # TEMP MEDIUM COMMIT END\n'),
          ]:
              start = text.index(start_marker)
              end = text.index(end_marker, start) + len(end_marker)
              text = text[:start] + text[end:]
          path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden medium-level data validation"
          git fetch origin fix/medium-audit-v1
          git rebase origin/fix/medium-audit-v1
          git push origin HEAD:fix/medium-audit-v1
      # TEMP MEDIUM COMMIT END
