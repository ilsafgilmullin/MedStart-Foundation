name: MedStart CI

on:
  push:
    branches:
      - main
      - 'fix/**'
    paths:
      - 'artifacts/medstart/**'
      - 'scripts/**'
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.json'
      - 'firestore.indexes.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'tsconfig*.json'
      - '.github/workflows/medstart-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'artifacts/medstart/**'
      - 'scripts/**'
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.json'
      - 'firestore.indexes.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'tsconfig*.json'
      - '.github/workflows/medstart-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: medstart-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Verify generated Firebase rules are committed
        run: |
          node scripts/apply-v6-rules.mjs
          git diff --exit-code -- firestore.rules storage.rules

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck MedStart
        run: pnpm --filter @workspace/medstart typecheck

      - name: Build MedStart
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: test-api-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: example.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: example
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: example.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '123456789'
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:123456789:web:test
          NEXT_PUBLIC_OWNER_UID: test-owner
        run: pnpm --filter @workspace/medstart build
