name: MedStart CI

on:
  push:
    branches:
      - main
      - 'fix/**'
    paths:
      - 'artifacts/medstart/**'
      - 'scripts/**'
      - 'firestore.rules'
      - 'firestore.secure.rules'
      - 'storage.rules'
      - 'firebase.json'
      - 'firestore.indexes.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'tsconfig*.json'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
    paths:
      - 'artifacts/medstart/**'
      - 'scripts/**'
      - 'firestore.rules'
      - 'firestore.secure.rules'
      - 'storage.rules'
      - 'firebase.json'
      - 'firestore.indexes.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'tsconfig*.json'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: medstart-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout critical branch
        uses: actions/checkout@v4
        with:
          ref: fix/critical-audit-v1
          fetch-depth: 0

      - name: Apply final critical source patch
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          rules = Path('firestore.secure.rules')
          source = rules.read_text(encoding='utf-8')
          source = source.replace(
              'allow create: if signedIn() && validBookingCreate();',
              'allow create: if false;',
              1,
          )
          source = source.replace(
              'allow create: if signedIn() && validConversationCreate(conversationId);',
              'allow create: if false;',
              1,
          )
          rules.write_text(source, encoding='utf-8')

          board = Path('artifacts/medstart/components/live/ServerlessWhiteboard.tsx')
          source = board.read_text(encoding='utf-8')
          source = source.replace('const CACHE_LIMIT = 400\n', '', 1)
          start = source.find('  useEffect(() => {\n    const cacheKey = `medstart-board-${bookingId}`')
          end_marker = '  }, [bookingId, elements])\n\n'
          if start >= 0:
              end = source.find(end_marker, start)
              if end < 0:
                  raise SystemExit('Whiteboard cache block end was not found')
              replacement = '''  useEffect(\n    () =>\n      subscribeToWhiteboard(\n        bookingId,\n        (next) => {\n          setElements(next.filter(isBoardElement))\n          setSyncState(navigator.onLine ? 'saved' : 'offline')\n        },\n        () => setSyncState(navigator.onLine ? 'error' : 'offline'),\n      ),\n    [bookingId],\n  )\n\n'''
              source = source[:start] + replacement + source[end + len(end_marker):]
          board.write_text(source, encoding='utf-8')

          Path('.github/workflows/apply-critical-stage3.yml').unlink(missing_ok=True)
          PY

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify hardened Firebase configuration
        run: |
          test -f firestore.secure.rules
          test -f storage.rules
          grep -q '"rules": "firestore.secure.rules"' firebase.json
          grep -q 'allow create, update: if false;' storage.rules
          grep -A2 'match /bookings/{bookingId}' firestore.secure.rules | grep -q 'allow create: if false;'
          grep -A2 'match /conversations/{conversationId}' firestore.secure.rules | grep -q 'allow create: if false;'
          ! grep -q 'medstart-board-' artifacts/medstart/components/live/ServerlessWhiteboard.tsx

      - name: Compile Firebase security rules
        env:
          CI: 'true'
        run: >-
          pnpm dlx firebase-tools@15.24.0 emulators:exec
          --only firestore,storage
          --project demo-medstart
          "echo Firebase security rules compiled"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck MedStart
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @workspace/medstart typecheck 2>&1 | tee typecheck.log

      - name: Upload typecheck report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medstart-critical-typecheck
          path: typecheck.log
          if-no-files-found: warn
          retention-days: 3

      - name: Build MedStart
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: test-api-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: example.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: example
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: example.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '123456789'
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:123456789:web:test
          NEXT_PUBLIC_OWNER_UID: test-owner
        run: pnpm --filter @workspace/medstart build

      - name: Commit validated critical patch
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "security: enforce server-only booking creation"
            git push origin HEAD:fix/critical-audit-v1
          fi
