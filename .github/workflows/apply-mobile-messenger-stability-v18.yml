name: Apply mobile messenger stability v18

on:
  push:
    branches:
      - agent/mobile-messenger-stability-v18

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/mobile-messenger-stability-v18
          fetch-depth: 0

      - name: Apply deterministic patch
        run: node scripts/apply-mobile-messenger-stability-v18.mjs

      - name: Remove transport files
        run: |
          rm scripts/apply-mobile-messenger-stability-v18.mjs
          rm .github/workflows/apply-mobile-messenger-stability-v18.yml

      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Исправить мобильный мессенджер и видеокружки"
          git push origin HEAD:agent/mobile-messenger-stability-v18
