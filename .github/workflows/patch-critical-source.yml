name: Patch critical source once

on:
  push:
    branches:
      - fix/critical-audit-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/critical-audit-v1
          fetch-depth: 0

      - name: Fix ResizeObserver narrowing
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('artifacts/medstart/components/live/ServerlessWhiteboard.tsx')
          source = path.read_text()
          old = """    if ('ResizeObserver' in window) {
              const observer = new ResizeObserver(render)
              observer.observe(container)
              return () => observer.disconnect()
            }

            window.addEventListener('resize', render)
            return () => window.removeEventListener('resize', render)
          """
          new = """    const ResizeObserverCtor = window.ResizeObserver
            if (typeof ResizeObserverCtor === 'function') {
              const observer = new ResizeObserverCtor(render)
              observer.observe(container)
              return () => observer.disconnect()
            }

            const browserWindow: Window = window
            browserWindow.addEventListener('resize', render)
            return () => browserWindow.removeEventListener('resize', render)
          """
          if old not in source:
              raise SystemExit('Target ResizeObserver block was not found')
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Commit source fix
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/medstart/components/live/ServerlessWhiteboard.tsx
          git commit -m "fix: correct ResizeObserver fallback typing"
          git push origin HEAD:fix/critical-audit-v1
