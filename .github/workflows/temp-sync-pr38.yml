name: Temporary sync PR 38

on:
  push:
    branches:
      - fix/remove-legacy-firestore-rules
    paths:
      - '.github/workflows/temp-sync-pr38.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/remove-legacy-firestore-rules

      - name: Merge current main and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-commit --no-ff origin/main
          rm .github/workflows/temp-sync-pr38.yml
          git add -A
          git commit -m "chore: sync Firestore Rules cleanup with main"
          git push origin HEAD:fix/remove-legacy-firestore-rules
