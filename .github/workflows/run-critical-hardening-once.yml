name: Run critical hardening once

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          ref: fix/critical-hardening-v1
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Apply deterministic migration
        id: migration
        continue-on-error: true
        shell: bash
        run: node scripts/run-critical-hardening.mjs > /tmp/critical-migration.log 2>&1

      - name: Persist migration failure
        if: steps.migration.outcome == 'failure'
        shell: bash
        run: |
          tail -120 /tmp/critical-migration.log > CRITICAL_MIGRATION_ERROR.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CRITICAL_MIGRATION_ERROR.txt
          if ! git diff --cached --quiet; then
            git commit -m "debug: capture critical migration failure"
            git push origin HEAD:fix/critical-hardening-v1
          fi

      - name: Stop after migration failure
        if: steps.migration.outcome == 'failure'
        run: |
          cat CRITICAL_MIGRATION_ERROR.txt
          exit 1

      - name: Verify security invariants
        run: node scripts/verify-critical-hardening.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck MedStart
        run: pnpm --filter @workspace/medstart typecheck

      - name: Build MedStart
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: test-api-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: example.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: example
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: example.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '123456789'
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:123456789:web:test
          NEXT_PUBLIC_OWNER_UID: test-owner
        run: pnpm --filter @workspace/medstart build

      - name: Commit validated branch changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f CRITICAL_MIGRATION_ERROR.txt
          if ! git diff --quiet; then
            git add firestore.rules storage.rules artifacts/medstart scripts .github/workflows CRITICAL_MIGRATION_ERROR.txt
            git commit -m "security: fix critical MedStart vulnerabilities"
            git push origin HEAD:fix/critical-hardening-v1
          fi

      - name: Remove bootstrap workflow from main
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git rm .github/workflows/run-critical-hardening-once.yml
          git commit -m "ci: remove critical hardening bootstrap"
          git push origin main
