name: Apply critical server-authority patches

on:
  push:
    branches:
      - fix/critical-audit-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/critical-audit-v1
          fetch-depth: 0

      - name: Disable client booking creation and browser board cache
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          rules = Path('firestore.secure.rules')
          source = rules.read_text(encoding='utf-8')
          replacements = {
              "allow create: if signedIn() && validBookingCreate();": "allow create: if false;",
              "allow create: if signedIn() && validConversationCreate(conversationId);": "allow create: if false;",
          }
          for old, new in replacements.items():
              if old not in source:
                  raise SystemExit(f'Missing expected rules fragment: {old}')
              source = source.replace(old, new, 1)
          rules.write_text(source, encoding='utf-8')

          board = Path('artifacts/medstart/components/live/ServerlessWhiteboard.tsx')
          source = board.read_text(encoding='utf-8')
          source = source.replace('const CACHE_LIMIT = 400\n', '', 1)

          load_cache = """  useEffect(() => {
            const cacheKey = `medstart-board-${bookingId}`
            try {
              const cached = localStorage.getItem(cacheKey)
              if (cached) {
                const parsed = JSON.parse(cached) as unknown
                if (Array.isArray(parsed)) setElements(parsed.filter(isBoardElement))
              }
            } catch {
              // Private mode can disable local storage.
            }

            return subscribeToWhiteboard(
              bookingId,
              (next) => {
                setElements(next.filter(isBoardElement))
                setSyncState(navigator.onLine ? 'saved' : 'offline')
              },
              () => setSyncState(navigator.onLine ? 'error' : 'offline'),
            )
          }, [bookingId])

          useEffect(() => {
            try {
              localStorage.setItem(
                `medstart-board-${bookingId}`,
                JSON.stringify(elements.slice(-CACHE_LIMIT)),
              )
            } catch {
              // Private mode can disable local storage.
            }
          }, [bookingId, elements])
          """
          replacement = """  useEffect(
            () =>
              subscribeToWhiteboard(
                bookingId,
                (next) => {
                  setElements(next.filter(isBoardElement))
                  setSyncState(navigator.onLine ? 'saved' : 'offline')
                },
                () => setSyncState(navigator.onLine ? 'error' : 'offline'),
              ),
            [bookingId],
          )
          """
          if load_cache not in source:
              raise SystemExit('Expected whiteboard cache block was not found')
          board.write_text(source.replace(load_cache, replacement, 1), encoding='utf-8')
          PY

      - name: Commit critical patches
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firestore.secure.rules artifacts/medstart/components/live/ServerlessWhiteboard.tsx
          git commit -m "security: enforce server booking writes and remove board cache"
          git push origin HEAD:fix/critical-audit-v1
