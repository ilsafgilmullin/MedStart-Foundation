name: Dependency lock refresh

on:
  push:
    branches:
      - security/release-governance-hardening
    paths:
      - package.json
      - artifacts/medstart/package.json
      - .github/workflows/dependency-lock-refresh.yml

permissions:
  contents: write

concurrency:
  group: medstart-dependency-lock-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refresh lockfile only
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Verify patched dependency targets
        shell: bash
        run: |
          grep -q 'version: 12.18.0' pnpm-lock.yaml
          grep -q 'version: 15.5.24' pnpm-lock.yaml

      - name: Commit refreshed lockfile
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'pnpm-lock.yaml is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'security(deps): refresh lockfile for patched runtimes'
          git push origin HEAD:security/release-governance-hardening

      - name: Upload refreshed lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medstart-pnpm-lock-refresh
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1
