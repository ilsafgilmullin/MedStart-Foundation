name: MedStart student workspace snapshot

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package current student workspace
        run: |
          zip -r medstart-student-workspace.zip \
            artifacts/medstart/app/dashboard/page.tsx \
            artifacts/medstart/app/dashboard/tutors \
            artifacts/medstart/app/dashboard/schedule \
            artifacts/medstart/app/dashboard/materials \
            artifacts/medstart/app/dashboard/knowledge \
            artifacts/medstart/app/dashboard/profile \
            artifacts/medstart/app/dashboard/settings \
            artifacts/medstart/components/dashboard \
            artifacts/medstart/lib/domain.ts \
            artifacts/medstart/lib/user-profile.ts \
            artifacts/medstart/lib/bookings.ts \
            artifacts/medstart/lib/materials.ts \
            -x '*/messages/*' '*/.next/*' '*/node_modules/*'

      - name: Upload protected workspace snapshot
        uses: actions/upload-artifact@v4
        with:
          name: medstart-student-workspace
          path: medstart-student-workspace.zip
          if-no-files-found: error
          retention-days: 1
