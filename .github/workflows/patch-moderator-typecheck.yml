name: One-time moderator typecheck fixes

on:
  push:
    branches:
      - security/moderator-role
    paths:
      - '.github/workflows/patch-moderator-typecheck.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/moderator-role
          fetch-depth: 0
      - name: Patch the two compiler findings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          moderation = Path('artifacts/medstart/app/dashboard/moderation/page.tsx')
          text = moderation.read_text()
          old = """          {[\n            ['Анкеты на проверке', overview.stats.pendingTutors, Clock3],\n            ['Активные репетиторы', overview.stats.activeTutors, UserCheck],\n            ['Приостановлены', overview.stats.suspendedTutors, Stethoscope],\n            ['Материалы на проверке', overview.stats.pendingKnowledge, BookOpenCheck],\n          ].map(([label, value, Icon]) => (\n            <article key={String(label)} className=\"rounded-[26px] border border-slate-200 bg-white p-5 shadow-sm\">\n              <Icon className=\"h-5 w-5 text-teal-700\" />\n              <p className=\"mt-4 text-3xl font-black text-slate-950\">{String(value)}</p>\n              <p className=\"mt-1 text-sm font-bold text-slate-500\">{String(label)}</p>\n            </article>\n          ))}"""
          new = """          {[\n            { label: 'Анкеты на проверке', value: overview.stats.pendingTutors, icon: Clock3 },\n            { label: 'Активные репетиторы', value: overview.stats.activeTutors, icon: UserCheck },\n            { label: 'Приостановлены', value: overview.stats.suspendedTutors, icon: Stethoscope },\n            { label: 'Материалы на проверке', value: overview.stats.pendingKnowledge, icon: BookOpenCheck },\n          ].map(({ label, value, icon: Icon }) => (\n            <article key={label} className=\"rounded-[26px] border border-slate-200 bg-white p-5 shadow-sm\">\n              <Icon className=\"h-5 w-5 text-teal-700\" />\n              <p className=\"mt-4 text-3xl font-black text-slate-950\">{value}</p>\n              <p className=\"mt-1 text-sm font-bold text-slate-500\">{label}</p>\n            </article>\n          ))}"""
          if old not in text:
            raise SystemExit('Moderation stats marker missing')
          moderation.write_text(text.replace(old, new, 1))

          messenger = Path('artifacts/medstart/components/messages/MedicalMessenger.tsx')
          text = messenger.read_text()
          old = "    if (!user || !profile || !role) return null\n"
          new = "    if (!user || !profile || !role || role === 'moderator') return null\n"
          if old not in text:
            raise SystemExit('Messenger sender marker missing')
          messenger.write_text(text.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit fixes and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/patch-moderator-typecheck.yml
          git add artifacts/medstart/app/dashboard/moderation/page.tsx artifacts/medstart/components/messages/MedicalMessenger.tsx
          git diff --cached --check
          git commit -m 'fix(moderation): resolve moderator typecheck findings'
          git push origin HEAD:security/moderator-role
