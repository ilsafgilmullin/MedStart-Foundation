name: Apply knowledge pipeline patch

on:
  push:
    branches:
      - security/knowledge-submission-pipeline
    paths:
      - '.github/workflows/apply-knowledge-pipeline.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: security/knowledge-submission-pipeline

      - name: Apply exact security replacements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          rules_path = Path('firestore.secure.rules')
          rules = rules_path.read_text()
          old_rules = '''    match /knowledgeSubmissions/{submissionId} {
              allow create: if signedIn() && validKnowledgeSubmissionCreate(submissionId);
              allow read: if isModerator()
                || (
                  signedIn()
                  && userExists(request.auth.uid)
                  && userProfile(request.auth.uid).status == 'active'
                  && (
                    resource.data.status == 'published'
                    || resource.data.submittedByUid == request.auth.uid
                  )
                );
              allow update: if isModerator() && validKnowledgeModeration();
              allow delete: if isModerator()
                || (
                  isActiveRole(request.auth.uid, 'tutor')
                  && resource.data.submittedByUid == request.auth.uid
                  && resource.data.status in ['pending', 'rejected']
                );
            }
          '''
          new_rules = '''    match /knowledgeSubmissions/{submissionId} {
              // All mutations are trusted server operations. Clients retain only
              // the minimum read access required for catalog and moderation UI.
              allow create: if false;
              allow read: if isModerator()
                || (
                  signedIn()
                  && userExists(request.auth.uid)
                  && userProfile(request.auth.uid).status == 'active'
                  && (
                    resource.data.status == 'published'
                    || resource.data.submittedByUid == request.auth.uid
                  )
                );
              allow update, delete: if false;
            }
          '''
          if old_rules not in rules:
              raise SystemExit('Expected Firestore knowledge block was not found')
          rules_path.write_text(rules.replace(old_rules, new_rules, 1))

          domain_path = Path('artifacts/medstart/lib/domain.ts')
          domain = domain_path.read_text()
          old_domain = '''  fileSize: number
            mimeType: string
            submittedByUid: string
          '''
          new_domain = '''  fileSize: number
            mimeType: string
            sha256?: string
            securityStatus?: 'link-validated' | 'signature-verified'
            malwareScanStatus?: 'not-applicable' | 'not-configured'
            storageState?: 'not-applicable' | 'quarantined' | 'published' | 'legacy'
            submittedByUid: string
          '''
          if old_domain not in domain:
              raise SystemExit('Expected KnowledgeSubmission fields were not found')
          domain_path.write_text(domain.replace(old_domain, new_domain, 1))

          audit_path = Path('scripts/final-audit-invariants.mjs')
          audit = audit_path.read_text()
          old_audit = '''  'artifacts/medstart/app/api/admin/action/route.ts',
            'artifacts/medstart/lib/admin-control.ts',
          '''
          new_audit = '''  'artifacts/medstart/app/api/admin/action/route.ts',
            'artifacts/medstart/app/api/knowledge/files/route.ts',
            'artifacts/medstart/app/api/knowledge/submissions/route.ts',
            'artifacts/medstart/app/api/knowledge/moderation/route.ts',
            'artifacts/medstart/lib/server/knowledge-access.ts',
            'artifacts/medstart/lib/server/knowledge-security.ts',
            'artifacts/medstart/lib/admin-control.ts',
          '''
          if old_audit not in audit:
              raise SystemExit('Expected final audit required-files block was not found')
          audit_path.write_text(audit.replace(old_audit, new_audit, 1))
          PY

      - name: Remove one-time workflow and commit exact files
        shell: bash
        run: |
          rm .github/workflows/apply-knowledge-pipeline.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- firestore.secure.rules artifacts/medstart/lib/domain.ts scripts/final-audit-invariants.mjs .github/workflows/apply-knowledge-pipeline.yml
          git commit -m 'security: enforce server-only knowledge mutations'
          git push origin HEAD:security/knowledge-submission-pipeline
