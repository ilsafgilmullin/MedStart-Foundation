name: MedStart owner admin snapshot

on:
  push:
    branches:
      - agent/owner-admin-control-v14
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Package current MedStart workspace
        run: tar -czf medstart-owner-admin-workspace.tar.gz artifacts/medstart firestore.secure.rules firebase.json scripts
      - name: Upload protected workspace snapshot
        uses: actions/upload-artifact@v4
        with:
          name: medstart-owner-admin-workspace
          path: medstart-owner-admin-workspace.tar.gz
          retention-days: 1
