name: Firebase live authentication audit

on:
  pull_request:
    branches:
      - main
    paths:
      - 'artifacts/medstart/lib/auth.ts'
      - 'artifacts/medstart/lib/firebase.ts'
      - 'artifacts/medstart/hooks/useLogin.ts'
      - 'artifacts/medstart/hooks/useStudentRegistration.ts'
      - 'artifacts/medstart/hooks/useTutorRegistration.ts'
      - 'artifacts/medstart/app/login/page.tsx'
      - 'artifacts/medstart/app/forgot-password/page.tsx'
      - 'artifacts/medstart/scripts/live-auth-audit.mjs'
      - 'firestore.secure.rules'
      - 'firebase.json'
      - '.github/workflows/auth-live-audit.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: firebase-live-auth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'fix/full-auth-audit-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=silent

      - name: Prepare Firebase service account
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "GitHub secret FIREBASE_SERVICE_ACCOUNT_JSON is not configured."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"

      - name: Reconcile deployed Firestore rules with audited repository rules
        id: deploy_rules
        continue-on-error: true
        shell: bash
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          set -o pipefail
          pnpm dlx firebase-tools@15.24.0 deploy \
            --project medstart-e9bfe \
            --only firestore:rules \
            --non-interactive 2>&1 | tee firebase-rules-deploy.log

      - name: Audit live Firebase authentication and request owner reset
        id: live_audit
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          SEND_OWNER_RESET: 'true'
        run: pnpm --dir artifacts/medstart exec node scripts/live-auth-audit.mjs

      - name: Publish sanitized audit result
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEPLOY_OUTCOME: ${{ steps.deploy_rules.outcome }}
        run: |
          node - <<'NODE' > auth-live-audit-comment.md
          const fs = require('node:fs')
          const reportPath = 'artifacts/medstart/auth-live-audit-report.json'
          console.log('### Firebase live authentication audit')
          console.log('')
          console.log(`Firestore rules deployment: **${process.env.DEPLOY_OUTCOME}**`)
          if (process.env.DEPLOY_OUTCOME !== 'success' && fs.existsSync('firebase-rules-deploy.log')) {
            const lines = fs.readFileSync('firebase-rules-deploy.log', 'utf8')
              .split(/\r?\n/)
              .filter((line) => line.trim())
              .slice(-12)
              .map((line) => line.replace(/[A-Za-z0-9_-]{30,}/g, '[redacted]'))
            console.log(`\nDeployment diagnostics:\n\n\`\`\`text\n${lines.join('\n')}\n\`\`\``)
          }
          if (!fs.existsSync(reportPath)) {
            console.log('\nThe authentication audit stopped before producing its sanitized report.')
            process.exit(0)
          }
          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'))
          const checks = report.checks
            .map((item) => `- ${item.status === 'passed' ? '✅' : '❌'} ${item.name}`)
            .join('\n')
          console.log(`\nAuthentication status: **${report.status}**`)
          if (report.error) console.log(`\nFailure: \`${report.error}\``)
          if (report.owner) {
            console.log(`\nOwner: verified=${report.owner.emailVerified}, disabled=${report.owner.disabled}, profile=${report.owner.profileExists}, role=${report.owner.role}, status=${report.owner.status}`)
          }
          if (checks) console.log(`\n${checks}`)
          NODE
          gh pr comment "$PR_NUMBER" --body-file auth-live-audit-comment.md

      - name: Upload sanitized audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medstart-live-auth-audit
          path: |
            artifacts/medstart/auth-live-audit-report.json
            firebase-rules-deploy.log
          if-no-files-found: warn
          retention-days: 3

      - name: Fail workflow when deployment or live audit failed
        if: steps.deploy_rules.outcome != 'success' || steps.live_audit.outcome != 'success'
        run: exit 1
