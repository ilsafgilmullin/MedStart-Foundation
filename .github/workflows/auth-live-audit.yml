name: Firebase live authentication audit

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'This job deploys Firestore Rules to medstart-e9bfe. Select DEPLOY_FIRESTORE_RULES only after explicit production approval.'
        required: true
        type: choice
        default: DO_NOT_DEPLOY
        options:
          - DO_NOT_DEPLOY
          - DEPLOY_FIRESTORE_RULES

permissions:
  contents: read

concurrency:
  group: firebase-live-auth-manual
  cancel-in-progress: false

jobs:
  audit:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY_FIRESTORE_RULES' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify production deployment ref
        shell: bash
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=silent

      - name: Prepare Firebase service account
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "GitHub secret FIREBASE_SERVICE_ACCOUNT_JSON is not configured."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"

      - name: Deploy audited rules and test live Firebase authentication
        id: live_audit
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          MEDSTART_ALLOW_RULES_DEPLOY: CONFIRMED
        run: pnpm --dir artifacts/medstart exec node scripts/live-auth-audit.mjs

      - name: Upload sanitized audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medstart-live-auth-audit
          path: artifacts/medstart/auth-live-audit-report.json
          if-no-files-found: warn
          retention-days: 3

      - name: Verify live audit outcome
        if: always()
        env:
          AUDIT_OUTCOME: ${{ steps.live_audit.outcome }}
        run: test "$AUDIT_OUTCOME" = "success"
