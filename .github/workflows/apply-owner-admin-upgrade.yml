name: Clean MedStart owner admin transport

on:
  push:
    branches:
      - agent/owner-admin-control-v14
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clean-owner-admin-transport
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upgrade branch
        uses: actions/checkout@v4
        with:
          ref: agent/owner-admin-control-v14
          fetch-depth: 0
      - name: Remove temporary transport
        run: |
          rm -rf .owner-admin-upgrade
          rm -f .github/workflows/owner-admin-snapshot.yml
          rm -f .github/workflows/apply-owner-admin-upgrade.yml
      - name: Commit clean branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Очистить транспорт центра управления владельца"
          git push origin HEAD:agent/owner-admin-control-v14
