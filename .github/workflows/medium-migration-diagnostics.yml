name: Medium migration diagnostics

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/medium-migration-diagnostics.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/medium-audit-v1
      - name: Inspect patch anchors
        shell: bash
        run: |
          python <<'PY' > medium-migration-diagnostics.txt
          from pathlib import Path

          files = {
              'rules': Path('firestore.secure.rules').read_text(),
              'storage': Path('storage.rules').read_text(),
              'workspace': Path('artifacts/medstart/components/live/MedicalWorkspace.tsx').read_text(),
          }

          anchors = {
              'profile_start': ('rules', '    function validNewProfile(userId) {'),
              'self_update_start': ('rules', '    function safeSelfUpdate() {'),
              'resubmission_start': ('rules', '    function validTutorResubmission() {'),
              'availability_start': ('rules', '    function validAvailability(data, tutorId) {'),
              'availability_match': ('rules', '    match /availability/{tutorId} {'),
              'lesson_read_start': ('rules', '    function canReadLessonData(bookingId) {'),
              'lesson_write_start': ('rules', '    function canWriteLessonData(bookingId) {'),
              'storage_read_start': ('storage', '    function canReadMedicalAsset(bookingId) {'),
              'storage_match': ('storage', '    match /medical-workspaces/{bookingId}/{userId}/{fileName} {'),
              'anatomy_helper': ('workspace', 'function anatomyDataUri(layer: AnatomyLayer, region: string, view: AnatomyView) {'),
              'lab_number': ('workspace', "const numericValue = Number(row.value.replace(',', '.'))"),
              'lab_badge': ('workspace', "flag === 'В пределах диапазона'"),
              'ecg_grid': ('workspace', 'className="mt-5 grid gap-4 md:grid-cols-2 xl:grid-cols-4"'),
              'material_create': ('rules', "request.resource.data.kind in ['link', 'document', 'video', 'note']"),
              'material_update': ('rules', "allow update: if isActiveRole(request.auth.uid, 'tutor')"),
          }

          for name, (file_key, needle) in anchors.items():
              print(f'{name}: {files[file_key].count(needle)}')

          print('\n=== storage medical section ===')
          storage = files['storage']
          pos = storage.find('function canReadMedicalAsset')
          print(storage[pos:pos+1200])

          print('\n=== material section ===')
          rules = files['rules']
          pos = rules.find('function validMaterialCreate')
          print(rules[pos:pos+2600])

          print('\n=== lab section ===')
          workspace = files['workspace']
          pos = workspace.find("const numericValue = Number(row.value.replace(',', '.'))")
          print(workspace[pos-300:pos+1800])
          PY
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: medium-migration-diagnostics
          path: medium-migration-diagnostics.txt
          retention-days: 3
