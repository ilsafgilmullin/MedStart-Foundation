name: MedStart presence snapshot

on:
  push:
    branches:
      - agent/platform-presence-v16
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Package repository
        run: tar -czf /tmp/medstart-presence-workspace.tar.gz --exclude=.git .
      - name: Upload workspace
        uses: actions/upload-artifact@v4
        with:
          name: medstart-presence-workspace
          path: /tmp/medstart-presence-workspace.tar.gz
          retention-days: 1
