name: Refresh brace-expansion lock

on:
  push:
    branches:
      - fix/brace-expansion-5-0-9
    paths:
      - '.github/workflows/refresh-brace-expansion-lock.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout dependency branch
        uses: actions/checkout@v4
        with:
          ref: fix/brace-expansion-5-0-9
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Apply exact brace-expansion update
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')

          function replaceExact(text, from, to, expectedCount, label) {
            const count = text.split(from).length - 1
            if (count !== expectedCount) {
              throw new Error(`${label}: expected ${expectedCount} occurrence(s), found ${count}`)
            }
            return text.split(from).join(to)
          }

          const workspacePath = 'pnpm-workspace.yaml'
          let workspace = fs.readFileSync(workspacePath, 'utf8')
          workspace = replaceExact(
            workspace,
            'brace-expansion@<=5.0.7: 5.0.8',
            'brace-expansion@<=5.0.8: 5.0.9',
            1,
            'workspace override',
          )
          fs.writeFileSync(workspacePath, workspace)

          const lockPath = 'pnpm-lock.yaml'
          let lock = fs.readFileSync(lockPath, 'utf8')
          lock = replaceExact(
            lock,
            'brace-expansion@<=5.0.7: 5.0.8',
            'brace-expansion@<=5.0.8: 5.0.9',
            1,
            'lock override',
          )
          lock = replaceExact(
            lock,
            'brace-expansion@5.0.8:',
            'brace-expansion@5.0.9:',
            2,
            'lock package keys',
          )
          lock = replaceExact(
            lock,
            'sha512-JZyDyq3D4AUifKTPOB7DELf6XsB3WdPuNxCtob1vFXPsSXhdAiHBWJ/tJ8HAc9aH84BK+5JFZLNkJKx3G9kzQg==',
            'sha512-ScQ4IuvIEF1TMlP7Zt+vjJ//9zlPb2SDcxWxM3bk8s6t6GGdJ7KO1dCcTidOPJKePW30LE/2cT7wCyPho9/Wxg==',
            1,
            'package integrity',
          )
          lock = replaceExact(
            lock,
            'brace-expansion: 5.0.8',
            'brace-expansion: 5.0.9',
            3,
            'minimatch dependency references',
          )
          fs.writeFileSync(lockPath, lock)
          NODE

      - name: Validate frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Verify production dependency audit
        run: pnpm audit --prod --audit-level high

      - name: Verify exact diff
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "pnpm-lock.yaml pnpm-workspace.yaml "
          grep -q 'brace-expansion@<=5.0.8: 5.0.9' pnpm-workspace.yaml
          grep -q 'brace-expansion@5.0.9:' pnpm-lock.yaml
          ! grep -q 'brace-expansion@5.0.8:' pnpm-lock.yaml

      - name: Commit validated lockfile update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- pnpm-workspace.yaml pnpm-lock.yaml
          git rm -- .github/workflows/refresh-brace-expansion-lock.yml
          git commit -m 'fix: update brace-expansion to 5.0.9'
          git push origin HEAD:fix/brace-expansion-5-0-9
