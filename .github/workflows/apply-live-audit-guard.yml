name: Apply live audit deployment guard

on:
  push:
    branches:
      - security/knowledge-submission-pipeline
    paths:
      - '.github/workflows/apply-live-audit-guard.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: security/knowledge-submission-pipeline

      - name: Add explicit production deployment guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('artifacts/medstart/scripts/live-auth-audit.mjs')
          source = path.read_text()
          old = """  const rulesetName = await deployFirestoreRules(credential)
            check('firestore-rules-api-deployed', { rulesetName })""".replace('            ', '  ')
          new = """  if (process.env.MEDSTART_ALLOW_RULES_DEPLOY !== 'CONFIRMED') {
              throw new Error(
                'Live audit refused to deploy Firestore Rules without explicit confirmation.',
              )
            }

            const rulesetName = await deployFirestoreRules(credential)
            check('firestore-rules-api-deployed', { rulesetName })""".replace('            ', '  ')
          if source.count(old) != 1:
              raise SystemExit('Expected one live audit deployment call')
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Remove one-time workflow and commit guard
        shell: bash
        run: |
          rm .github/workflows/apply-live-audit-guard.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- artifacts/medstart/scripts/live-auth-audit.mjs .github/workflows/apply-live-audit-guard.yml
          git commit -m 'security: guard live Firebase rules deployment'
          git push origin HEAD:security/knowledge-submission-pipeline
