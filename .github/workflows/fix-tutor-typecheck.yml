name: Fix MedStart tutor typecheck

on:
  push:
    branches:
      - agent/tutor-workspace-upgrade-v13
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upgrade branch
        uses: actions/checkout@v4
        with:
          ref: agent/tutor-workspace-upgrade-v13
          fetch-depth: 0
          show-progress: false
      - name: Fix TypeScript findings
        shell: python
        run: |
          from pathlib import Path

          profile = Path('artifacts/medstart/app/dashboard/profile/page.tsx')
          text = profile.read_text()
          old = "  async function copyTutorPreviewLink() {\n    try {"
          new = "  async function copyTutorPreviewLink() {\n    if (!profile) return\n    try {"
          assert text.count(old) == 1
          profile.write_text(text.replace(old, new))

          requests = Path('artifacts/medstart/app/dashboard/requests/page.tsx')
          text = requests.read_text()
          old_map = "{responseTemplates[decision].map((template) => ("
          new_map = "{responseTemplates[decision].map((template, index) => ("
          old_label = "Шаблон {responseTemplates[decision].indexOf(template) + 1}"
          new_label = "Шаблон {index + 1}"
          assert text.count(old_map) == 1
          assert text.count(old_label) == 1
          requests.write_text(text.replace(old_map, new_map).replace(old_label, new_label))
      - name: Remove temporary workflow
        run: rm -f .github/workflows/fix-tutor-typecheck.yml
      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Исправить типы кабинета репетитора"
          git push origin HEAD:agent/tutor-workspace-upgrade-v13
