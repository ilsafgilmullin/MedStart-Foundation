name: Temporary MedStart school track gate batch

on:
  push:
    branches:
      - security/release-governance-hardening
    paths:
      - '.github/workflows/school-track-gate-batch.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/release-governance-hardening
          fetch-depth: 0

      - name: Gate school and minor scope by default
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual < count:
                  raise SystemExit(f'{path}: expected at least {count}, found {actual}: {old!r}')
              p.write_text(text.replace(old, new, count))

          register = 'artifacts/medstart/app/api/auth/register/route.ts'
          patch(register,
              "import { firebaseIdentityRequest } from '@/lib/server/firebase-identity'\n",
              "import { firebaseIdentityRequest } from '@/lib/server/firebase-identity'\nimport { schoolTrackEnabled } from '@/lib/server/feature-flags'\n")
          patch(register,
              "  const tutorAudiences = normalizeTutorAudiences(body.tutorAudiences)\n  const examTypes = normalizeExamTypes(body.examTypes)\n",
              "  const tutorAudiences = normalizeTutorAudiences(body.tutorAudiences)\n  const examTypes = normalizeExamTypes(body.examTypes)\n  const schoolEnabled = schoolTrackEnabled()\n\n  if (\n    !schoolEnabled &&\n    ((role === 'student' && learnerTrack === 'school') ||\n      (role === 'tutor' && tutorAudiences.includes('school')))\n  ) {\n    return NextResponse.json(\n      { ok: false, code: 'SCHOOL_TRACK_DISABLED' },\n      { status: 403, headers: noStoreHeaders() },\n    )\n  }\n")

          booking = 'artifacts/medstart/app/api/bookings/route.ts'
          patch(booking,
              "} from '@/lib/server/firebase-admin'\n",
              "} from '@/lib/server/firebase-admin'\nimport { schoolTrackEnabled } from '@/lib/server/feature-flags'\n")
          patch(booking,
              "      const learnerTrack =\n        student.learnerTrack === 'school' ? 'school' : 'medical'\n",
              "      const learnerTrack =\n        student.learnerTrack === 'school' ? 'school' : 'medical'\n      if (learnerTrack === 'school' && !schoolTrackEnabled()) {\n        throw new Error(\n          'Школьный трек MedStart временно недоступен до завершения отдельного правового контура.',\n        )\n      }\n")

          moderation = 'artifacts/medstart/app/api/moderation/tutors/route.ts'
          patch(moderation,
              "import { getFirebaseAdminDb } from '@/lib/server/firebase-admin'\n",
              "import { getFirebaseAdminDb } from '@/lib/server/firebase-admin'\nimport { schoolTrackEnabled } from '@/lib/server/feature-flags'\n")
          patch(moderation,
              "        displayName?: string\n      }\n",
              "        displayName?: string\n        tutorAudiences?: unknown\n      }\n")
          patch(moderation,
              "      const previousStatus = profile.status as TutorStatus\n\n      if (decision === 'approve') {\n",
              "      const previousStatus = profile.status as TutorStatus\n      const tutorAudiences = Array.isArray(profile.tutorAudiences)\n        ? profile.tutorAudiences.filter(\n            (item): item is 'medical' | 'school' =>\n              item === 'medical' || item === 'school',\n          )\n        : ['medical']\n      if (\n        !schoolTrackEnabled() &&\n        (decision === 'approve' || decision === 'reinstate') &&\n        !tutorAudiences.includes('medical')\n      ) {\n        throw new ModerationAccessError(\n          409,\n          'SCHOOL_TRACK_DISABLED',\n          'Нельзя публиковать профиль только школьного направления, пока школьный трек отключён.',\n        )\n      }\n\n      if (decision === 'approve') {\n")

          firestore = 'artifacts/medstart/lib/firestore.ts'
          patch(firestore,
              "import { PRIMARY_OWNER_UID } from './access-control'\n",
              "import { PRIMARY_OWNER_UID } from './access-control'\nimport { SCHOOL_TRACK_ENABLED } from './feature-flags'\n")
          patch(firestore,
              "function publicTutorsQuery() {\n",
              "function visibleTutorForCurrentScope(profile: UserProfile) {\n  if (SCHOOL_TRACK_ENABLED) return true\n  if (!Array.isArray(profile.tutorAudiences)) return true\n  return profile.tutorAudiences.includes('medical')\n}\n\nfunction publicTutorsQuery() {\n")
          patch(firestore,
              "  return sortTutors(snapshot.docs.map((item) => item.data() as UserProfile))\n",
              "  return sortTutors(\n    snapshot.docs\n      .map((item) => item.data() as UserProfile)\n      .filter(visibleTutorForCurrentScope),\n  )\n")
          patch(firestore,
              "    profile.isPublic\n    ? profile\n",
              "    profile.isPublic &&\n    visibleTutorForCurrentScope(profile)\n    ? profile\n")
          patch(firestore,
              "        sortTutors(snapshot.docs.map((item) => item.data() as UserProfile)),\n",
              "        sortTutors(\n          snapshot.docs\n            .map((item) => item.data() as UserProfile)\n            .filter(visibleTutorForCurrentScope),\n        ),\n")

          student_hook = 'artifacts/medstart/hooks/useStudentRegistration.ts'
          patch(student_hook,
              "      case 'INVALID_REGISTRATION':\n        return 'Проверьте заполненные данные и требования к паролю.'\n",
              "      case 'INVALID_REGISTRATION':\n        return 'Проверьте заполненные данные и требования к паролю.'\n      case 'SCHOOL_TRACK_DISABLED':\n        return 'Школьный трек пока закрыт. Сейчас MedStart принимает студентов медвузов.'\n")

          tutor_hook = 'artifacts/medstart/hooks/useTutorRegistration.ts'
          patch(tutor_hook,
              "      case 'INVALID_REGISTRATION':\n        return 'Проверьте заполненные данные и требования к паролю.'\n",
              "      case 'INVALID_REGISTRATION':\n        return 'Проверьте заполненные данные и требования к паролю.'\n      case 'SCHOOL_TRACK_DISABLED':\n        return 'Школьный трек пока закрыт. Выберите преподавание для студентов медвузов.'\n")

          student = 'artifacts/medstart/app/register/student/page.tsx'
          patch(student,
              "import { ROUTES } from '@/lib/constants'\n",
              "import { ROUTES } from '@/lib/constants'\nimport { SCHOOL_TRACK_ENABLED } from '@/lib/feature-flags'\n")
          patch(student,
              "      description=\"Создайте профиль школьника для подготовки к ОГЭ и ЕГЭ или профиль студента медвуза. После подтверждения почты откроются преподаватели, расписание, сообщения и материалы.\"\n",
              "      description={\n        SCHOOL_TRACK_ENABLED\n          ? 'Создайте профиль школьника для подготовки к ОГЭ и ЕГЭ или профиль студента медвуза. После подтверждения почты откроются преподаватели, расписание, сообщения и материалы.'\n          : 'Создайте профиль студента медвуза. После подтверждения почты откроются преподаватели, расписание, сообщения и медицинские учебные материалы.'\n      }\n")
          school_option = """              {\n                value: 'school' as LearnerTrack,\n                label: 'Школьник',\n                hint: 'Подготовка к ОГЭ и ЕГЭ',\n                icon: School,\n              },\n"""
          replacement = """              ...(SCHOOL_TRACK_ENABLED\n                ? [\n                    {\n                      value: 'school' as LearnerTrack,\n                      label: 'Школьник',\n                      hint: 'Подготовка к ОГЭ и ЕГЭ',\n                      icon: School,\n                    },\n                  ]\n                : []),\n"""
          patch(student, school_option, replacement)
          patch(student,
              "        {form.learnerTrack === 'medical' ? (\n",
              "        {form.learnerTrack === 'medical' || !SCHOOL_TRACK_ENABLED ? (\n")

          tutor = 'artifacts/medstart/app/register/tutor/page.tsx'
          patch(tutor,
              "import { ROUTES } from '@/lib/constants'\n",
              "import { ROUTES } from '@/lib/constants'\nimport { SCHOOL_TRACK_ENABLED } from '@/lib/feature-flags'\n")
          patch(tutor,
              "      description=\"Заполните профессиональный профиль для занятий со школьниками, студентами медвузов или обеими группами. После подтверждения почты анкета поступит на модерацию.\"\n",
              "      description={\n        SCHOOL_TRACK_ENABLED\n          ? 'Заполните профессиональный профиль для занятий со школьниками, студентами медвузов или обеими группами. После подтверждения почты анкета поступит на модерацию.'\n          : 'Заполните профессиональный профиль для занятий со студентами медвузов. После подтверждения почты анкета поступит на модерацию.'\n      }\n")
          tutor_school_option = """                {\n                  value: 'school' as LearnerTrack,\n                  label: 'Школьники',\n                  hint: 'ОГЭ и ЕГЭ',\n                  icon: School,\n                },\n"""
          tutor_replacement = """                ...(SCHOOL_TRACK_ENABLED\n                  ? [\n                      {\n                        value: 'school' as LearnerTrack,\n                        label: 'Школьники',\n                        hint: 'ОГЭ и ЕГЭ',\n                        icon: School,\n                      },\n                    ]\n                  : []),\n"""
          patch(tutor, tutor_school_option, tutor_replacement)
          p = Path(tutor)
          text = p.read_text()
          text = text.replace("{form.tutorAudiences.includes('school') && (", "{SCHOOL_TRACK_ENABLED && form.tutorAudiences.includes('school') && (")
          p.write_text(text)

          home = 'artifacts/medstart/app/page.tsx'
          patch(home,
              "import Link from 'next/link'\n",
              "import Link from 'next/link'\nimport { SCHOOL_TRACK_ENABLED } from '@/lib/feature-flags'\n")
          patch(home,
              "export const metadata: Metadata = {\n  title: 'MedStart — ОГЭ, ЕГЭ и медицинское обучение',\n  description:\n    'Индивидуальные занятия для школьников и студентов медвузов: подготовка к ОГЭ и ЕГЭ, медицинские дисциплины, видео, доска и учебные материалы.',\n}\n",
              "export const metadata: Metadata = {\n  title: SCHOOL_TRACK_ENABLED\n    ? 'MedStart — ОГЭ, ЕГЭ и медицинское обучение'\n    : 'MedStart — индивидуальное обучение студентов-медиков',\n  description: SCHOOL_TRACK_ENABLED\n    ? 'Индивидуальные занятия для школьников и студентов медвузов: подготовка к ОГЭ и ЕГЭ, медицинские дисциплины, видео, доска и учебные материалы.'\n    : 'Индивидуальные занятия для студентов медвузов: медицинские дисциплины, видео, совместная доска и проверенные учебные материалы.',\n}\n")
          patch(home,
              "    eyebrow: '8–11 классы',\n",
              "    enabled: SCHOOL_TRACK_ENABLED,\n    eyebrow: '8–11 классы',\n")
          patch(home,
              "    eyebrow: 'Студентам медвузов',\n",
              "    enabled: true,\n    eyebrow: 'Студентам медвузов',\n")
          patch(home,
              "  },\n]\n\nconst lessonTools",
              "  },\n].filter((item) => item.enabled)\n\nconst lessonTools")
          patch(home,
              "              ОГЭ · ЕГЭ · медицинские дисциплины\n",
              "              {SCHOOL_TRACK_ENABLED\n                ? 'ОГЭ · ЕГЭ · медицинские дисциплины'\n                : 'Медицинские дисциплины · индивидуальное обучение'}\n")
          patch(home,
              "              MedStart объединяет подготовку школьников к ОГЭ и ЕГЭ и\n              индивидуальное обучение студентов-медиков в одной современной\n              платформе.\n",
              "              {SCHOOL_TRACK_ENABLED\n                ? 'MedStart объединяет подготовку школьников к ОГЭ и ЕГЭ и индивидуальное обучение студентов-медиков в одной современной платформе.'\n                : 'MedStart объединяет студентов-медиков и проверенных профильных преподавателей: занятия, видео, совместную доску и учебные материалы в одной платформе.'}\n")
          patch(home,
              "                <div className=\"mt-4 grid gap-3 sm:grid-cols-2\">\n                  <div className=\"rounded-2xl border border-cyan-200 bg-cyan-50 p-4\">\n",
              "                <div\n                  className={`mt-4 grid gap-3 ${SCHOOL_TRACK_ENABLED ? 'sm:grid-cols-2' : ''}`}\n                >\n                  {SCHOOL_TRACK_ENABLED && (\n                    <div className=\"rounded-2xl border border-cyan-200 bg-cyan-50 p-4\">\n")
          patch(home,
              "                    <p className=\"mt-2 text-xs leading-5 text-slate-600\">\n                      8–11 классы · выбор предметов\n                    </p>\n                  </div>\n\n                  <div className=\"rounded-2xl border border-violet-200 bg-violet-50 p-4\">\n",
              "                    <p className=\"mt-2 text-xs leading-5 text-slate-600\">\n                      8–11 классы · выбор предметов\n                    </p>\n                    </div>\n                  )}\n\n                  <div className=\"rounded-2xl border border-violet-200 bg-violet-50 p-4\">\n")
          patch(home,
              "            title=\"Одна платформа для разных учебных целей\"\n            description=\"При регистрации ученик выбирает свою траекторию, а MedStart показывает подходящих преподавателей и инструменты.\"\n",
              "            title={\n              SCHOOL_TRACK_ENABLED\n                ? 'Одна платформа для разных учебных целей'\n                : 'Медицинское обучение в одном пространстве'\n            }\n            description={\n              SCHOOL_TRACK_ENABLED\n                ? 'При регистрации ученик выбирает свою траекторию, а MedStart показывает подходящих преподавателей и инструменты.'\n                : 'Студент медвуза выбирает профильного преподавателя, бронирует занятие и продолжает работу с материалами в одном кабинете.'\n            }\n")
          patch(home,
              "          <div className=\"mt-9 grid gap-5 lg:grid-cols-2\">\n",
              "          <div\n            className={`mt-9 grid gap-5 ${SCHOOL_TRACK_ENABLED ? 'lg:grid-cols-2' : 'mx-auto max-w-3xl'}`}\n          >\n")

          env = '.env.example'
          p = Path(env)
          text = p.read_text()
          marker = "# Учебные PDF публикуются только после fail-closed ClamAV INSTREAM scan."
          if marker not in text:
              raise SystemExit('.env.example scope insertion marker missing')
          block = "# Школьный трек/несовершеннолетние выключены по умолчанию до отдельной\n# продуктовой, юридической и privacy-проработки. Backend-флаг является\n# авторитетным; NEXT_PUBLIC-флаг управляет только отображением интерфейса.\nMEDSTART_SCHOOL_TRACK_ENABLED=false\nNEXT_PUBLIC_MEDSTART_SCHOOL_TRACK_ENABLED=false\n\n"
          p.write_text(text.replace(marker, block + marker, 1))

          invariants = 'scripts/final-audit-invariants.mjs'
          patch(invariants,
              "  'artifacts/medstart/lib/server/auth-security.ts',\n",
              "  'artifacts/medstart/lib/server/auth-security.ts',\n  'artifacts/medstart/lib/feature-flags.ts',\n  'artifacts/medstart/lib/server/feature-flags.ts',\n")
          PY

      - name: Commit scope gate
        run: |
          git config user.name "ilsafgilmullin"
          git config user.email "ilsafgilmullin@gmail.com"
          git add artifacts/medstart .env.example scripts/final-audit-invariants.mjs
          git diff --cached --check
          git commit -m "Выключить школьный трек до отдельного правового контура"
          git push origin HEAD:security/release-governance-hardening
