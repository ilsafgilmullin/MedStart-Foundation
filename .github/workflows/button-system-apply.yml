name: Clean MedStart button audit transport

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/button-system-apply.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: agent/unified-button-system-v11
          fetch-depth: 0

      - name: Remove temporary audit transport
        run: |
          rm -f .github/button-system.patch.gz.b64
          rm -rf .github/button-patches
          rm -f .github/workflows/button-system-snapshot.yml
          rm -f .github/workflows/button-system-apply.yml

      - name: Commit clean branch
        run: |
          git config user.name 'MedStart UI Audit'
          git config user.email 'audit@medstart.local'
          git add -A .github
          git diff --cached --check
          git commit -m 'Удалить временные файлы аудита кнопок'
          git push origin HEAD:agent/unified-button-system-v11
