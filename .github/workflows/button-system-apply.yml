name: Apply MedStart button system

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/button-system-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: medstart-button-system-apply
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: agent/unified-button-system-v11
          fetch-depth: 0

      - name: Decode and verify reviewed patch
        run: |
          base64 --decode .github/button-system.patch.gz.b64 | gzip --decompress > /tmp/medstart-button-system.patch
          echo '97274e4f9a3211fff0f87b7f89832f22ae8d67f049c9d01e616e4ca9fecf591f  /tmp/medstart-button-system.patch' | sha256sum --check --strict
          test "$(grep -c '^diff --git ' /tmp/medstart-button-system.patch)" -eq 32
          git apply --check /tmp/medstart-button-system.patch

      - name: Apply unified button system
        run: git apply /tmp/medstart-button-system.patch

      - name: Commit audited UI changes
        run: |
          git config user.name 'MedStart UI Audit'
          git config user.email 'audit@medstart.local'
          git add artifacts/medstart
          git diff --cached --check
          git commit -m 'Унифицировать все кнопки MedStart'
          git push origin HEAD:agent/unified-button-system-v11
