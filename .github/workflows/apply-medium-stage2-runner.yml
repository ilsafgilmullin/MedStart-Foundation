name: Apply medium stage two runner

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/apply-medium-stage2-runner.yml'

permissions:
  contents: write

jobs:
  apply-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/medium-audit-v1
          fetch-depth: 0
      - name: Extract and apply stage two migration
        shell: bash
        run: |
          python <<'EXTRACT'
          from pathlib import Path

          source = Path('.github/workflows/apply-medium-stage2-once.yml').read_text()
          start_marker = "          python <<'PY'\n"
          end_marker = "\n          PY"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          embedded = source[start:end]
          lines = [line[10:] if line.startswith('          ') else line for line in embedded.splitlines()]
          Path('/tmp/apply-medium-stage2.py').write_text('\n'.join(lines) + '\n')
          EXTRACT
          python /tmp/apply-medium-stage2.py
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate Firebase rules
        run: >-
          pnpm dlx firebase-tools@15.24.0 emulators:exec
          --only firestore,storage
          --project demo-medstart
          "node scripts/test-critical-rules.mjs && node scripts/test-medium-rules.mjs"
      - name: Typecheck
        run: pnpm --filter @workspace/medstart typecheck
      - name: Build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: test-api-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: example.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: example
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: example.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '123456789'
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:123456789:web:test
          NEXT_PUBLIC_OWNER_UID: test-owner
        run: pnpm --filter @workspace/medstart build
      - name: Commit validated stage two fixes
        run: |
          rm -f .github/workflows/apply-medium-stage2-once.yml
          rm -f .github/workflows/apply-medium-stage2-runner.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden medium-level data validation"
          git fetch origin fix/medium-audit-v1
          git rebase origin/fix/medium-audit-v1
          git push origin HEAD:fix/medium-audit-v1
