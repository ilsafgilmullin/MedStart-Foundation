name: Apply medium stage two runner

on:
  push:
    branches:
      - fix/medium-audit-v1
    paths:
      - '.github/workflows/apply-medium-stage2-runner.yml'

permissions:
  contents: write

jobs:
  apply-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/medium-audit-v1
          fetch-depth: 0

      - name: Apply deterministic medium migration
        run: python scripts/apply-medium-stage2.py

      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate, build, and persist result
        shell: bash
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: test-api-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: example.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: example
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: example.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '123456789'
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:123456789:web:test
          NEXT_PUBLIC_OWNER_UID: test-owner
        run: |
          set +e
          {
            echo '=== Firebase rules ==='
            pnpm dlx firebase-tools@15.24.0 emulators:exec \
              --only firestore,storage \
              --project demo-medstart \
              "node scripts/test-critical-rules.mjs && node scripts/test-medium-rules.mjs"
            rules_status=$?
            echo "rules_status=$rules_status"

            echo '=== TypeScript ==='
            pnpm --filter @workspace/medstart typecheck
            type_status=$?
            echo "type_status=$type_status"

            echo '=== Production build ==='
            pnpm --filter @workspace/medstart build
            build_status=$?
            echo "build_status=$build_status"

            if [ "$rules_status" -ne 0 ] || [ "$type_status" -ne 0 ] || [ "$build_status" -ne 0 ]; then
              exit 1
            fi
          } > medium-stage2-validation.log 2>&1
          status=$?
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$status" -ne 0 ]; then
            cp medium-stage2-validation.log MEDIUM_STAGE2_FAILURE.txt
            git add MEDIUM_STAGE2_FAILURE.txt
            git commit -m "ci: record medium stage two validation failure"
            git fetch origin fix/medium-audit-v1
            git rebase origin/fix/medium-audit-v1
            git push origin HEAD:fix/medium-audit-v1
            exit 0
          fi

          rm -f MEDIUM_STAGE2_FAILURE.txt
          rm -f .github/workflows/apply-medium-stage2-once.yml
          rm -f .github/workflows/apply-medium-stage2-runner.yml
          rm -f .github/workflows/apply-medium-stage2-v3.yml
          rm -f .github/workflows/apply-medium-stage2-v4.yml
          rm -f .github/workflows/apply-verified-access.yml
          rm -f .github/workflows/medium-stage2-error.yml
          rm -f scripts/apply-medium-stage2.py
          git add -A
          git commit -m "fix: harden medium-level data validation"
          git fetch origin fix/medium-audit-v1
          git rebase origin/fix/medium-audit-v1
          git push origin HEAD:fix/medium-audit-v1
